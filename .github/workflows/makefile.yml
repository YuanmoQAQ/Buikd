name: Build OnePlus 8T Kernel (OOS 14)

on:
  workflow_dispatch: # 允许手动点击按钮触发编译

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AnyKernel3
        uses: actions/checkout@v4
        with:
          repository: osm0sis/AnyKernel3
          path: AnyKernel3

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y git bc bison flex libssl-dev make libc6-dev libncurses5-dev \
            crossbuild-essential-arm64 build-essential libelf-dev dwarves zstd \
            lzop gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: 克隆内核源码 (带权限验证)
        run: |
          # 使用 GITHUB_TOKEN 进行身份验证以克隆私有仓库
          git clone --depth=1 -b oneplus/sm8250_u_14.0.0_op8t \
            https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/YuanmoQAQ/android_kernel_oneplus_sm8250.git kernel

      - name: 设置环境变量
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CC=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "PATH=$PATH:/usr/bin" >> $GITHUB_ENV

      - name: 开始编译内核
        run: |
          cd kernel
          
          # 1. 清理环境
          make clean && make mrproper
          
          # 2. 加载配置文件 (一加8T通常使用 vendor/kona-perf_defconfig)
          # 如果不确定，可以 ls arch/arm64/configs/ 查看具体文件名
          make O=out ARCH=arm64 vendor/kona-perf_defconfig
          
          # 3. 执行编译 (-j$(nproc) 表示使用所有核心加速)
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc)

      - name: 打包刷入包 (AnyKernel3)
        run: |
          # 将编译好的 Image 复制到 AnyKernel3 目录
          cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          
          # 如果你需要单独打包 dtbo.img，可以在这里处理，或者让 AnyKernel3 自动处理
          # cp kernel/out/arch/arm64/boot/dts/qcom/sm8250-oneplus-kebab.dtb AnyKernel3/dtbo.img

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus8T-Kernel-OOS14
          path: AnyKernel3/*
