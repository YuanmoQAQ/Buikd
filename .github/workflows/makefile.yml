name: Build OnePlus 8T Kernel (OOS 14 + SukiSU + BPF Backport)

on:
  workflow_dispatch:
    inputs:
      suki_branch:
        description: 'SukiSU 分支 (默认 main)'
        required: false
        default: 'main'
      bpf_patches_url:
        description: 'BPF 补丁集合的 Git 仓库地址 (留空则跳过)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AnyKernel3
        uses: actions/checkout@v4
        with:
          repository: osm0sis/AnyKernel3
          path: AnyKernel3

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y git bc bison flex libssl-dev make libc6-dev libncurses5-dev \
            crossbuild-essential-arm64 build-essential libelf-dev dwarves zstd \
            lzop gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: 克隆内核源码
        run: |
          git clone --depth=1 -b oneplus/sm8250_u_14.0.0_op8t \
            https://github.com/OnePlusOSS/android_kernel_oneplus_sm8250.git kernel

      - name: 应用 BPF 回移补丁
        if: ${{ github.event.inputs.bpf_patches_url != '' }}
        run: |
          cd kernel
          # 克隆包含 BPF backport 补丁的仓库
          git clone --depth=1 ${{ github.event.inputs.bpf_patches_url }} bpf-patches
          # 逐个应用补丁
          for patch in bpf-patches/*.patch; do
            echo "Applying: $patch"
            git am "$patch" || {
              echo "⚠️ 补丁冲突: $patch，尝试三向合并..."
              git am --abort
              git apply --3way "$patch" || echo "❌ 跳过: $patch"
            }
          done

      - name: 集成 SukiSU
        run: |
          cd kernel
          git clone --depth=1 -b ${{ github.event.inputs.suki_branch }} \
            https://github.com/SukiSU-Ultra/SukiSU-Ultra.git suki
          bash suki/install.sh

      - name: 设置环境变量
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CC=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: 开始编译内核
        run: |
          cd kernel
          make clean && make mrproper
          make O=out ARCH=arm64 vendor/kona-perf_defconfig
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc)

      - name: 打包刷入包 (AnyKernel3)
        run: |
          cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus8T-Kernel-OOS14-SukiSU-BPF
          path: AnyKernel3/*
