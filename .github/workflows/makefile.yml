name: Build OnePlus 8T Kernel (OOS 14 + SukiSU)

on:
  workflow_dispatch:
    inputs:
      suki_branch:
        description: 'SukiSU 分支 (默认 main)'
        required: false
        default: 'main'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AnyKernel3
        uses: actions/checkout@v4
        with:
          repository: osm0sis/AnyKernel3
          path: AnyKernel3

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y git bc bison flex libssl-dev make libc6-dev libncurses5-dev \
            crossbuild-essential-arm64 build-essential libelf-dev dwarves zstd \
            lzop gcc-aarch64-linux-gnu g++-aarch64-linux-gnu python3 python-is-python3 curl

      - name: 克隆内核源码
        run: |
          git clone --depth=1 -b oneplus/sm8250_u_14.0.0_op8t \
            https://github.com/OnePlusOSS/android_kernel_oneplus_sm8250.git kernel

      - name: 集成 SukiSU（含 BPF 支持）
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin

      - name: 修复核心文件 (kconfig & wrapper)
        run: |
          cd kernel

          echo "========== 修复 1: 重新下载 scripts/kconfig/conf =========="
          # 之前的错误显示 conf 可能变成了目录或损坏，直接下载官方原版覆盖
          if [ -d "scripts/kconfig/conf" ]; then
            echo "⚠️ 检测到 conf 是目录，正在删除..."
            rm -rf scripts/kconfig/conf
          fi
          curl -fsSLo scripts/kconfig/conf https://raw.githubusercontent.com/torvalds/linux/master/scripts/kconfig/conf
          chmod +x scripts/kconfig/conf
          # 确保使用 python3
          sed -i '1s|^#!/usr/bin/env python$|#!/usr/bin/env python3|' scripts/kconfig/conf
          echo "✅ scripts/kconfig/conf 已修复"

          echo "========== 修复 2: 恢复 init/Kconfig 原版 =========="
          # 之前的 sed 操作可能破坏了语法，直接从 OnePlus 仓库拉取原版覆盖
          curl -fsSLo init/Kconfig https://raw.githubusercontent.com/OnePlusOSS/android_kernel_oneplus_sm8250/oneplus/sm8250_u_14.0.0_op8t/init/Kconfig
          echo "✅ init/Kconfig 已恢复原版"

          echo "========== 修复 3: 移除 Makefile 中的 gcc-wrapper.py (Python 2 兼容性问题) =========="
          # 直接删除 wrapper 引用，让编译器直接工作
          sed -i '/^REAL_CC\s*=/d' Makefile
          sed -i '/scripts\/gcc-wrapper\.py/d' Makefile
          echo "✅ gcc-wrapper.py 引用已移除"

          echo "========== 修复 4: 清理无效的 Kconfig 引用 =========="
          # 仅清理那些确实不存在的文件引用，不再做复杂的语法修改
          find . -name "Kconfig" -type f | while read -r kconfig_file; do
            while IFS= read -r line; do
              file=$(echo "$line" | grep -oP '(?<=source ").*(?=")')
              if [ -n "$file" ]; then
                dir=$(dirname "$kconfig_file")
                resolved="$dir/$file"
                if [ ! -f "$resolved" ] && [ ! -d "$resolved" ]; then
                  echo "⚠️ 移除无效引用: $file (在 $kconfig_file 中)"
                  sed -i "\|source \"$file\"|d" "$kconfig_file"
                fi
              fi
            done < <(grep 'source "' "$kconfig_file" 2>/dev/null)
          done
          echo "✅ 无效引用清理完成"

          echo "========== 修复 5: defconfig 补充必要配置 =========="
          DEFCONFIG="arch/arm64/configs/vendor/kona-perf_defconfig"
          if [ -f "$DEFCONFIG" ]; then
            sed -i 's/# CONFIG_KPROBES is not set/CONFIG_KPROBES=y/' "$DEFCONFIG"
            sed -i 's/# CONFIG_HAVE_KPROBES is not set/CONFIG_HAVE_KPROBES=y/' "$DEFCONFIG"
            sed -i 's/# CONFIG_KPROBE_EVENTS is not set/CONFIG_KPROBE_EVENTS=y/' "$DEFCONFIG"
            grep -q "CONFIG_BPF_SYSCALL=y" "$DEFCONFIG" || echo "CONFIG_BPF_SYSCALL=y" >> "$DEFCONFIG"
            grep -q "CONFIG_BPF_JIT=y" "$DEFCONFIG" || echo "CONFIG_BPF_JIT=y" >> "$DEFCONFIG"
            sed -i 's/CONFIG_LOCALVERSION_AUTO=y/CONFIG_LOCALVERSION_AUTO=n/' "$DEFCONFIG"
            echo "✅ defconfig 配置补充完成"
          fi

          echo "========== 所有修复完成 =========="

      - name: 设置环境变量
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV

      - name: 开始编译内核
        run: |
          cd kernel
          make clean && make mrproper
          make O=out ARCH=arm64 vendor/kona-perf_defconfig
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc)

      - name: 打包刷入包 (AnyKernel3)
        run: |
          echo "========== 查找内核产物 =========="
          BOOT_DIR="kernel/out/arch/arm64/boot"
          ls -la "$BOOT_DIR"

          if [ -f "$BOOT_DIR/Image.gz-dtb" ]; then
            cp "$BOOT_DIR/Image.gz-dtb" AnyKernel3/
          elif [ -f "$BOOT_DIR/Image.gz" ]; then
            cp "$BOOT_DIR/Image.gz" AnyKernel3/
            if ls "$BOOT_DIR/dts/qcom/"*.dtb 1>/dev/null 2>&1; then
              mkdir -p AnyKernel3/dtb
              cp "$BOOT_DIR/dts/qcom/"*.dtb AnyKernel3/dtb/
            fi
          elif [ -f "$BOOT_DIR/Image-dtb" ]; then
            cp "$BOOT_DIR/Image-dtb" AnyKernel3/
          elif [ -f "$BOOT_DIR/Image" ]; then
            cp "$BOOT_DIR/Image" AnyKernel3/
          else
            echo "❌ 未找到内核镜像！"
            find kernel/out -name "Image*" -o -name "*.dtb" 2>/dev/null
            exit 1
          fi

          ls -la AnyKernel3/

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus8T-Kernel-OOS14-SukiSU
          path: AnyKernel3/
          if-no-files-found: error
