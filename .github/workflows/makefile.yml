name: Build OnePlus 8T Kernel (OOS 14 + SukiSU)

on:
  workflow_dispatch:
    inputs:
      suki_branch:
        description: 'SukiSU 分支 (默认 main)'
        required: false
        default: 'main'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AnyKernel3
        uses: actions/checkout@v4
        with:
          repository: osm0sis/AnyKernel3
          path: AnyKernel3

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y git bc bison flex libssl-dev make libc6-dev libncurses5-dev \
            crossbuild-essential-arm64 build-essential libelf-dev dwarves zstd \
            lzop gcc-aarch64-linux-gnu g++-aarch64-linux-gnu python3

      - name: 克隆内核源码
        run: |
          git clone --depth=1 -b oneplus/sm8250_u_14.0.0_op8t \
            https://github.com/OnePlusOSS/android_kernel_oneplus_sm8250.git kernel

      - name: 集成 SukiSU（含 BPF 支持）
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin

      - name: 修复已知编译问题
        run: |
          cd kernel

          echo "========== 修复 1: sched_assist Kconfig 缺失 =========="
          if [ ! -d "kernel/sched_assist" ]; then
            echo "⚠️ sched_assist 目录不存在，移除 init/Kconfig 中的引用..."
            sed -i '/sched_assist/d' init/Kconfig
            echo "✅ 已修复"
          fi

          echo "========== 修复 2: KPM __bad_copy_from 编译错误 =========="
          if [ -f "drivers/kernelsu/kpm/kpm.c" ]; then
            echo "⚠️ 检测到 kpm.c，修复 __bad_copy_from 错误..."
            # 注释掉 sukisu_kpm_list 函数中导致 copy source size too small 的代码块
            sed -i '/sukisu_kpm_list/,/^}/ {
              /copy_to_user/s/^/\/\//
              /__bad_copy_from/s/^/\/\//
            }' drivers/kernelsu/kpm/kpm.c
            echo "✅ 已修复"
          fi

          echo "========== 修复 3: CPU 调度器 unused variable 警告 =========="
          if [ -f "kernel/sched/ext.c" ]; then
            echo "⚠️ 检测到 ext.c，修复 free_dsq_irq_work 未使用变量..."
            sed -i 's/static DEFINE_IRQ_WORK(free_dsq_irq_work/static __maybe_unused DEFINE_IRQ_WORK(free_dsq_irq_work/' kernel/sched/ext.c
            echo "✅ 已修复"
          fi

          echo "========== 修复 4: Python 2/3 兼容性问题 =========="
          # 将内核脚本中的 python 调用强制指向 python3
          find scripts/ -name "*.py" -exec sed -i '1s|^#!/usr/bin/env python$|#!/usr/bin/env python3|' {} \;
          find scripts/ -name "*.sh" -exec sed -i 's/\bpython\b/python3/g' {} \;
          echo "✅ 已修复"

          echo "========== 修复 5: defconfig 补充必要配置 =========="
          DEFCONFIG="arch/arm64/configs/vendor/kona-perf_defconfig"
          if [ -f "$DEFCONFIG" ]; then
            echo "⚠️ 补充 Kprobes 和其他必要配置..."
            # 确保 Kprobes 开启（SukiSU 依赖）
            sed -i 's/# CONFIG_KPROBES is not set/CONFIG_KPROBES=y/' "$DEFCONFIG"
            sed -i 's/# CONFIG_HAVE_KPROBES is not set/CONFIG_HAVE_KPROBES=y/' "$DEFCONFIG"
            sed -i 's/# CONFIG_KPROBE_EVENTS is not set/CONFIG_KPROBE_EVENTS=y/' "$DEFCONFIG"
            # 确保 BPF 相关配置开启
            grep -q "CONFIG_BPF_SYSCALL=y" "$DEFCONFIG" || echo "CONFIG_BPF_SYSCALL=y" >> "$DEFCONFIG"
            grep -q "CONFIG_BPF_JIT=y" "$DEFCONFIG" || echo "CONFIG_BPF_JIT=y" >> "$DEFCONFIG"
            # 关闭 LOCALVERSION_AUTO 避免编译警告
            sed -i 's/CONFIG_LOCALVERSION_AUTO=y/CONFIG_LOCALVERSION_AUTO=n/' "$DEFCONFIG"
            echo "✅ 已修复"
          fi

          echo "========== 修复 6: 其他缺失 Kconfig 引用 =========="
          # 扫描 init/Kconfig 中所有 source 引用，移除指向不存在文件的行
          while IFS= read -r line; do
            file=$(echo "$line" | grep -oP '(?<=source ").*(?=")')
            if [ -n "$file" ] && [ ! -f "$file" ] && [ ! -d "$(dirname $file)" ]; then
              echo "⚠️ 移除无效引用: $file"
              sed -i "\|$file|d" init/Kconfig
            fi
          done < <(grep 'source "' init/Kconfig)
          echo "✅ 已修复"

          echo "========== 所有修复完成 =========="

      - name: 设置环境变量
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CC=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: 开始编译内核
        run: |
          cd kernel
          make clean && make mrproper
          make O=out ARCH=arm64 vendor/kona-perf_defconfig
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc)

      - name: 打包刷入包 (AnyKernel3)
        run: |
          cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus8T-Kernel-OOS14-SukiSU
          path: AnyKernel3/*
